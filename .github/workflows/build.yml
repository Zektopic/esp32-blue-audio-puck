name: build

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref; a stale build helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: idf ${{ matrix.idf_version }} / esp32
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_version: ["v5.5.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: esp32

      - name: Report image size
        run: |
          echo "### Firmware size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l build/*.bin >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
